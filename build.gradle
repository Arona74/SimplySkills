plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url 'https://jitpack.io' }
    mavenCentral() // ✅ required for MixinExtras
}

dependencies {
    // Core Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ModMenu (compile only)
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") { transitive false }

    // External mods
    modImplementation "curse.maven:puffish-skills-835091:${project.puffish_skills_version}"
    modImplementation "curse.maven:puffish-attributes-991341:${project.puffish_attributes_version}"
    modImplementation "maven.modrinth:spell-power:${project.spellpower_version}-fabric"
    modImplementation "maven.modrinth:spell-engine:${project.spell_engine_version}-fabric"
    modImplementation "curse.maven:simply-swords-659887:5255981"
    modImplementation "curse.maven:paladins-and-priests-856548:${project.paladins_version}"
    modImplementation "curse.maven:immersive-melodies-904471:${project.immersive_melodies_version}"
    modImplementation "curse.maven:open-parties-and-claims-636608:${project.openpac_version}"
    modImplementation "curse.maven:amethyst-core-639888:5255903"
    modImplementation "curse.maven:archers-932359:${project.archers_version}"

    // ✅ MixinExtras (official Maven Central)
    implementation "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"

    // ✅ TinyConfig (from JitPack)
    implementation "com.github.ZsoltMolnarrr:TinyConfig:${project.tiny_config_version}"

    // Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Compat for Factions (local jar)
    modImplementation files('libs/factions.jar')
}

processResources {
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "license", project.license
    inputs.property "version", project.version
    inputs.property "mod_authors", project.mod_authors
    inputs.property "mod_description", project.mod_description
    inputs.property "contact_homepage", project.contact_homepage
    inputs.property "contact_sources", project.contact_sources
    inputs.property "contact_issues", project.contact_issues
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "mod_id": project.mod_id,
                "mod_name": project.name,
                "license": project.license,
                "version": project.version,
                "mod_authors": project.mod_authors,
                "mod_description": project.mod_description,
                "contact_homepage": project.contact_homepage,
                "contact_sources": project.contact_sources,
                "contact_issues": project.contact_issues,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
